<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>✨ High Graphics 3D Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               -webkit-tap-highlight-color: transparent; }
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
          filter: blur(80px); opacity: .55; mix-blend-mode: screen;
          animation: drift 18s ease-in-out infinite; }
  .blob:nth-child(1){ background:#0066ff; top:-20%; left:-20%; animation-delay:0s;}
  .blob:nth-child(2){ background:#ff3399; bottom:-30%; right:-20%; animation-delay:-6s;}
  .blob:nth-child(3){ background:#00ffaa; top:20%; right:-10%; animation-delay:-12s; width:40vmax; height:40vmax;}
  .blob:nth-child(4){ background:#9933ff; bottom:0; left:10%; animation-delay:-9s; width:35vmax; height:35vmax;}
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(8vw,-6vh) scale(1.15); }
    66%     { transform: translate(-6vw,8vh) scale(.9); }
  }
  #canvas-wrap { position: fixed; inset: 0; z-index: 1; }
  canvas { display:block; width:100%!important; height:100%!important; touch-action:none; }

  /* TOP BAR */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            display:flex; justify-content:space-between; align-items:center;
            padding: 14px 18px; pointer-events:none; }
  #title { color:#fff; font-weight:800; font-size:16px; letter-spacing:.5px;
           text-shadow: 0 0 14px rgba(0,200,255,.8); }
  #musicBtn { pointer-events:auto; width:44px; height:44px; border-radius:50%;
              border:1px solid rgba(255,255,255,.25);
              background: rgba(255,255,255,.08); backdrop-filter: blur(14px);
              color:#fff; font-size:18px; cursor:pointer;
              display:flex; align-items:center; justify-content:center;
              transition: transform .15s, background .2s; }
  #musicBtn:active { transform: scale(.92); }
  #musicBtn.off   { opacity:.6; }

  /* ACTION GRID */
  #actions { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
             display:grid; grid-template-columns: repeat(2, 1fr);
             gap: 10px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
             max-width: 520px; margin: 0 auto; }
  .btn { position: relative; color:#fff; font-weight:700; font-size:14px;
         padding: 14px 8px; border-radius:14px; border:1px solid rgba(255,255,255,.22);
         background: linear-gradient(135deg, rgba(0,200,255,.30), rgba(180,0,255,.30));
         backdrop-filter: blur(14px); cursor:pointer; overflow:hidden;
         transition: transform .12s ease, box-shadow .25s; user-select:none; }
  .btn:active { transform: scale(.95); box-shadow: 0 0 24px rgba(0,200,255,.6); }
  .btn::after { content:''; position:absolute; inset:0;
                background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 60%);
                opacity:0; transition: opacity .25s; }
  .btn:active::after { opacity:1; }

  /* LOADING */
  #loader { position: fixed; inset:0; z-index: 100; background:#000;
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-weight:700; font-size:16px; letter-spacing:2px;
            transition: opacity .6s ease; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader span { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  @media (max-width: 480px) {
    .btn { font-size: 13px; padding: 12px 6px; }
    #title { font-size: 14px; }
  }
</style>
</head>
<body>

<div id="bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div id="canvas-wrap"></div>

<div id="topbar">
  <div id="title">✨ HIGH GFX DEMO</div>
  <button id="musicBtn" title="Toggle Music">🔊</button>
</div>

<div id="actions">
  <button class="btn" data-action="explode">💥 Explode</button>
  <button class="btn" data-action="vortex">🌀 Vortex</button>
  <button class="btn" data-action="shock">🌊 Shockwave</button>
  <button class="btn" data-action="color">🎨 Color</button>
  <button class="btn" data-action="pulse">💓 Pulse</button>
  <button class="btn" data-action="gravity">🪐 Gravity</button>
  <button class="btn" data-action="shake">📳 Shake</button>
  <button class="btn" data-action="reset">🔄 Reset</button>
</div>

<div id="loader"><span>LOADING…</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ══════════════════════════════════════════════
   1. RENDERER
   ══════════════════════════════════════════════ */
const container = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ══════════════════════════════════════════════
   2. SCENE + CAMERA
   ══════════════════════════════════════════════ */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 2.2, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 12;
controls.target.set(0, 0.2, 0);
controls.autoRotate = false;

/* ══════════════════════════════════════════════
   3. ENVIRONMENT (for reflections)
   ══════════════════════════════════════════════ */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1024, 512);
  grad.addColorStop(0,   '#050520');
  grad.addColorStop(0.4, '#0066ff');
  grad.addColorStop(0.7, '#ff3399');
  grad.addColorStop(1,   '#000000');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  // hot spots
  const spots = [[180,120,'#00ffff'],[600,180,'#ff00aa'],[850,380,'#ffaa00']];
  for (const [x,y,col] of spots) {
    const rg = g.createRadialGradient(x,y,0,x,y,180);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'transparent');
    g.fillStyle = rg;
    g.fillRect(x-180,y-180,360,360);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const envTex = makeEnvTexture();
scene.environment = envTex;

/* ══════════════════════════════════════════════
   4. LIGHTS
   ══════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x404060, 0.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff3388, 40, 20);
rimLight.position.set(-4, 3, -4);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x00aaff, 40, 20);
fillLight.position.set(4, 2, 4);
scene.add(fillLight);

/* ══════════════════════════════════════════════
   5. HERO TORUS KNOT (metallic)
   ══════════════════════════════════════════════ */
const heroGeo = new THREE.TorusKnotGeometry(1.3, 0.42, 300, 48, 2, 3);
const heroMat = new THREE.MeshPhysicalMaterial({
  color: 0x1188ee,
  metalness: 1.0,
  roughness: 0.10,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  emissive: 0x004488,
  emissiveIntensity: 0.35,
  envMapIntensity: 1.8
});
const hero = new THREE.Mesh(heroGeo, heroMat);
hero.castShadow = true;
scene.add(hero);

/* ══════════════════════════════════════════════
   6. ORBITING NEON SPHERES
   ══════════════════════════════════════════════ */
const spheres = [];
const spherePivots = [];
const sphereCount = 8;
const sphereRadius = 3.0;

for (let i = 0; i < sphereCount; i++) {
  const hue = i / sphereCount;
  const col = new THREE.Color().setHSL(hue, 0.9, 0.55);
  const mat = new THREE.MeshPhysicalMaterial({
    color: col,
    metalness: 0.7,
    roughness: 0.2,
    emissive: col,
    emissiveIntensity: 0.9,
    envMapIntensity: 1.4
  });
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), mat);
  s.castShadow = true;

  const pivot = new THREE.Object3D();
  const angle = (i / sphereCount) * Math.PI * 2;
  const y = (Math.random() - 0.5) * 2.5;
  s.position.set(Math.cos(angle) * sphereRadius, y, Math.sin(angle) * sphereRadius);

  pivot.add(s);
  scene.add(pivot);
  spheres.push(s);
  spherePivots.push(pivot);
}

/* ══════════════════════════════════════════════
   7. SPARK PARTICLES
   ══════════════════════════════════════════════ */
const PARTICLE_COUNT = 800;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colors    = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  // start inside torus radius
  const a = Math.random() * Math.PI * 2;
  const r = 1.6 + Math.random() * 0.4;
  positions[i*3]   = Math.cos(a) * r;
  positions[i*3+1] = (Math.random() - 0.5) * 1.0;
  positions[i*3+2] = Math.sin(a) * r;

  velocities[i*3]   = (Math.random() - 0.5) * 0.8;
  velocities[i*3+1] = Math.random() * 1.2 + 0.3;
  velocities[i*3+2] = (Math.random() - 0.5) * 0.8;

  const c = new THREE.Color().setHSL(0.06 + Math.random()*0.08, 1, 0.6);
  colors[i*3]   = c.r;
  colors[i*3+1] = c.g;
  colors[i*3+2] = c.b;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

/* ══════════════════════════════════════════════
   8. REFLECTIVE FLOOR
   ══════════════════════════════════════════════ */
const mirrorGeo = new THREE.PlaneGeometry(30, 30);
const mirror = new Reflector(mirrorGeo, {
  clipBias: 0.003,
  textureWidth: window.innerWidth * Math.min(devicePixelRatio, 2),
  textureHeight: window.innerHeight * Math.min(devicePixelRatio, 2),
  color: 0x111122
});
mirror.rotation.x = -Math.PI / 2;
mirror.position.y = -2.0;
scene.add(mirror);

// subtle grid overlay on floor
const gridGeo = new THREE.PlaneGeometry(30, 30);
const gridMat = new THREE.MeshBasicMaterial({
  color: 0x224466, transparent: true, opacity: 0.15
});
const grid = new THREE.Mesh(gridGeo, gridMat);
grid.rotation.x = -Math.PI / 2;
grid.position.y = -1.999;
scene.add(grid);

/* ══════════════════════════════════════════════
   9. POST-PROCESSING (HDR Bloom)
   ══════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.1,   // strength
  0.5,   // radius
  0.55   // threshold
);
composer.addPass(bloom);

/* ══════════════════════════════════════════════
   10. ANIMATION STATE
   ══════════════════════════════════════════════ */
const clock = new THREE.Clock();
const state = {
  explodeT: 0, vortexT: 0, pulseT: 0, gravityT: 0, shakeT: 0,
  vortexActive: false,
  sphereOriginals: spheres.map(s => s.position.clone()),
};

/* ══════════════════════════════════════════════
   11. ACTIONS
   ══════════════════════════════════════════════ */
function explode() {
  state.explodeT = 1.0;
}
function vortex() {
  state.vortexActive = !state.vortexActive;
  state.vortexT = 3.0;
}
function shockwave() {
  const ringGeo = new THREE.TorusGeometry(0.15, 0.06, 16, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(hero.position);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  let t = 0;
  const grow = () => {
    t += 0.02;
    if (t > 1) { scene.remove(ring); return; }
    const s = 1 + t * 14;
    ring.scale.set(s, s, s);
    ringMat.opacity = 1 - t;
    requestAnimationFrame(grow);
  };
  grow();
}
function colorShift() {
  const hue = Math.random();
  heroMat.color.setHSL(hue, 0.9, 0.5);
  heroMat.emissive.setHSL(hue, 0.9, 0.3);
  for (const s of spheres) {
    const c = new THREE.Color().setHSL(Math.random(), 0.9, 0.55);
    s.material.color.copy(c);
    s.material.emissive.copy(c);
  }
}
function pulse() {
  state.pulseT = 1.0;
}
function gravity() {
  state.gravityT = 1.0;
}
function shake() {
  state.shakeT = 0.6;
}
function reset() {
  state.explodeT = state.vortexT = state.pulseT = state.gravityT = state.shakeT = 0;
  state.vortexActive = false;
  hero.scale.set(1, 1, 1);
  hero.rotation.set(0, 0, 0);
  spheres.forEach((s, i) => {
    s.position.copy(state.sphereOriginals[i]);
  });
}

const actions = {
  explode, vortex, shock: shockwave, color: colorShift,
  pulse, gravity, shake, reset
};

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    if (actions[a]) actions[a]();
    if (navigator.vibrate) navigator.vibrate(20);
  });
});

/* ══════════════════════════════════════════════
   12. BACKGROUND MUSIC (Web Audio ambient pad)
   ══════════════════════════════════════════════ */
let audioCtx = null;
let masterGain = null;
let musicOn = false;
const musicBtn = document.getElementById('musicBtn');

function startMusic() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.08;
    masterGain.connect(audioCtx.destination);

    // Open fifth pad: E2 A2 E3 A3 (165, 220, 330, 440 Hz)
    [165, 220, 330, 440].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();

      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = freq;

      lfo.frequency.value = 0.25 + i * 0.07;
      lfoGain.gain.value = 1.5;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();

      // slow tremolo
      const trem = audioCtx.createOscillator();
      const tremGain = audioCtx.createGain();
      trem.frequency.value = 0.15 + i * 0.04;
      tremGain.gain.value = 0.4;
      trem.connect(tremGain);
      tremGain.connect(oscGain.gain);

      oscGain.gain.value = 0.5;
      osc.connect(oscGain);
      oscGain.connect(masterGain);

      osc.start();
      trem.start();
    });
  }
  audioCtx.resume();
  musicOn = true;
  musicBtn.textContent = '🔊';
  musicBtn.classList.remove('off');
}

function stopMusic() {
  if (audioCtx) audioCtx.suspend();
  musicOn = false;
  musicBtn.textContent = '🔇';
  musicBtn.classList.add('off');
}

musicBtn.addEventListener('click', () => {
  if (musicOn) stopMusic(); else startMusic();
});

// Auto-start on first user interaction (mobile requires gesture)
document.body.addEventListener('pointerdown', () => {
  if (!audioCtx && !musicOn) startMusic();
}, { once: true });

/* ══════════════════════════════════════════════
   13. RENDER LOOP
   ══════════════════════════════════════════════ */
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  // Hero base rotation + float
  hero.rotation.y += dt * 0.6;
  hero.rotation.x = Math.sin(t * 0.5) * 0.15;
  hero.position.y = Math.sin(t * 0.8) * 0.3;

  // Pulse
  if (state.pulseT > 0) {
    state.pulseT -= dt * 3;
    const s = 1 + Math.max(0, state.pulseT) * 0.4 * Math.abs(Math.sin(t * 20));
    hero.scale.setScalar(s);
  } else {
    hero.scale.lerp(new THREE.Vector3(1,1,1), dt * 6);
  }

  // Explode
  if (state.explodeT > 0) {
    state.explodeT -= dt * 2;
    spheres.forEach((s, i) => {
      const dir = state.sphereOriginals[i].clone().normalize();
      const k = Math.max(0, state.explodeT);
      s.position.copy(state.sphereOriginals[i]).addScaledVector(dir, k * 3);
    });
    hero.scale.setScalar(1 + state.explodeT * 0.6);
  }

  // Vortex
  if (state.vortexActive) {
    spheres.forEach((s, i) => {
      const p = spherePivots[i];
      p.rotation.y += dt * (4 + i * 0.3);
      p.rotation.x += dt * 2;
    });
  } else {
    spherePivots.forEach((p, i) => {
      p.rotation.y += dt * (0.3 + i * 0.05);
    });
  }

  // Gravity
  if (state.gravityT > 0) {
    state.gravityT -= dt * 1.5;
    const k = Math.max(0, state.gravityT);
    spheres.forEach((s, i) => {
      const target = new THREE.Vector3(0, 0, 0);
      const orig = state.sphereOriginals[i];
      s.position.lerpVectors(orig, target, k);
    });
  }

  // Shake camera
  if (state.shakeT > 0) {
    state.shakeT -= dt;
    const amp = state.shakeT * 0.4;
    camera.position.x = (Math.random() - 0.5) * amp;
    camera.position.y = 2.2 + (Math.random() - 0.5) * amp;
  }

  // Orbit controls
  controls.update();

  // Particles
  const posArr = particleGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    posArr[i*3]   += velocities[i*3]   * dt;
    posArr[i*3+1] += velocities[i*3+1] * dt;
    posArr[i*3+2] += velocities[i*3+2] * dt;

    // recycle if too high or far
    const dx = posArr[i*3], dy = posArr[i*3+1], dz = posArr[i*3+2];
    if (dy > 4 || dx*dx + dz*dz > 25) {
      const a = Math.random() * Math.PI * 2;
      const r = 1.6 + Math.random() * 0.4;
      posArr[i*3]   = Math.cos(a) * r;
      posArr[i*3+1] = -0.5;
      posArr[i*3+2] = Math.sin(a) * r;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;
  particles.rotation.y += dt * 0.1;

  composer.render();
}

/* ══════════════════════════════════════════════
   14. RESIZE
   ══════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
});

/* ══════════════════════════════════════════════
   15. START
   ══════════════════════════════════════════════ */
animate();

// hide loader after first frame
setTimeout(() => document.getElementById('loader').classList.add('hide'), 400);
</script>
</body>
    </html>
