<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>✨ Neon 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --tg-bg: var(--tg-theme-bg-color, #0a0a12);
    --tg-text: var(--tg-theme-text-color, #ffffff);
    --tg-hint: var(--tg-theme-hint-color, #8b8b99);
    --tg-link: var(--tg-theme-link-color, #64b5ff);
    --tg-btn: var(--tg-theme-button-color, #2ea6ff);
    --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
    --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c28);
    --accent-1: #00e5ff;
    --accent-2: #ff2ea6;
    --accent-3: #a020ff;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ═══ ANIMATED BG ═══ */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    filter: blur(90px); opacity: .45; mix-blend-mode: screen;
    animation: drift 20s ease-in-out infinite;
  }
  .blob:nth-child(1){ background:#0066ff; top:-30%; left:-25%; }
  .blob:nth-child(2){ background:#ff0099; bottom:-35%; right:-25%; animation-delay:-7s;}
  .blob:nth-child(3){ background:#00ffcc; top:15%; right:-15%; animation-delay:-13s; width:45vmax; height:45vmax;}
  .blob:nth-child(4){ background:#7a00ff; bottom:5%; left:5%; animation-delay:-10s; width:40vmax; height:40vmax;}
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(10vw,-8vh) scale(1.18); }
  }

  /* ═══ CANVAS ═══ */
  #canvas-wrap { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block !important; width: 100% !important; height: 100% !important; touch-action: none; }

  /* ═══ TOP BAR (user profile) ═══ */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
    pointer-events: none;
  }
  #avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
    border: 2px solid rgba(255,255,255,.3);
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(0,229,255,.5);
  }
  #avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  #userinfo { flex: 1; min-width: 0; }
  #username {
    font-size: 15px; font-weight: 700; letter-spacing: -.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 10px rgba(0,229,255,.4);
  }
  #userstatus {
    font-size: 11px; color: var(--tg-hint); margin-top: 1px;
    display: flex; align-items: center; gap: 5px;
  }
  #userstatus::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 8px #00ff88;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  #musicBtn {
    pointer-events: auto;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--tg-text); font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .25s;
  }
  #musicBtn:active { transform: scale(.9); }
  #musicBtn.on { box-shadow: 0 0 20px rgba(0,229,255,.6); }
  #musicBtn.off { opacity: .5; }

  /* ═══ ACTION PILLS (horizontal scroll) ═══ */
  #pills {
    position: fixed; left: 0; right: 0; bottom: calc(90px + env(safe-area-inset-bottom));
    z-index: 10;
    display: flex; gap: 8px; padding: 0 16px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x mandatory;
  }
  #pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--tg-text);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    scroll-snap-align: start;
    transition: transform .12s, box-shadow .2s, background .2s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .pill:active {
    transform: scale(.94);
    background: linear-gradient(135deg, rgba(0,229,255,.35), rgba(255,46,166,.35));
    box-shadow: 0 0 24px rgba(0,229,255,.5);
  }
  .pill .ico { font-size: 15px; }

  /* ═══ BOTTOM BAR (Telegram-style) ═══ */
  #bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--tg-bg) 30%, transparent);
    display: flex; gap: 10px;
  }
  #mainBtn {
    flex: 1;
    padding: 15px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font-size: 15px; font-weight: 800;
    letter-spacing: .3px;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,229,255,.35), 0 0 40px rgba(255,46,166,.25);
    transition: transform .12s, box-shadow .25s;
  }
  #mainBtn:active {
    transform: scale(.97);
    box-shadow: 0 4px 16px rgba(0,229,255,.5);
  }

  /* ═══ LOADER ═══ */
  #loader {
    position: fixed; inset: 0; z-index: 100;
    background: var(--tg-bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
    transition: opacity .6s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--accent-1);
    border-right-color: var(--accent-2);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p {
    font-size: 13px; letter-spacing: 4px; font-weight: 700;
    color: var(--tg-hint);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* ═══ TOAST ═══ */
  #toast {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 50;
    padding: 10px 20px; border-radius: 14px;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(20px);
    color: #fff; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div id="canvas-wrap"></div>

<!-- TOP BAR -->
<div id="topbar">
  <div id="avatar">?</div>
  <div id="userinfo">
    <div id="username">Loading...</div>
    <div id="userstatus">online</div>
  </div>
  <button id="musicBtn" class="off">🔇</button>
</div>

<!-- ACTION PILLS -->
<div id="pills">
  <div class="pill" data-action="explode"><span class="ico">💥</span>Explode</div>
  <div class="pill" data-action="vortex"><span class="ico">🌀</span>Vortex</div>
  <div class="pill" data-action="shock"><span class="ico">🌊</span>Shock</div>
  <div class="pill" data-action="color"><span class="ico">🎨</span>Color</div>
  <div class="pill" data-action="pulse"><span class="ico">💓</span>Pulse</div>
  <div class="pill" data-action="gravity"><span class="ico">🪐</span>Gravity</div>
  <div class="pill" data-action="shake"><span class="ico">📳</span>Shake</div>
  <div class="pill" data-action="reset"><span class="ico">🔄</span>Reset</div>
</div>

<!-- BOTTOM BAR -->
<div id="bottom">
  <button id="mainBtn">⚡ TRIGGER MAGIC</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- LOADER -->
<div id="loader">
  <div class="ring"></div>
  <p>NEON</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ══════════════════════════════════════════════
   1. TELEGRAM WEBAPP
   ══════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
let tgUser = { first_name: 'Guest', last_name: '', username: 'guest', photo_url: '' };
let hapticsOn = true;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('secondary_bg_color');
  tg.setBackgroundColor('bg_color');

  if (tg.initDataUnsafe?.user) {
    tgUser = tg.initDataUnsafe.user;
  }

  // Disable vertical swipe to close (keep the scene free for drag)
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

function haptic(type = 'light') {
  if (!tg?.HapticFeedback) return;
  try {
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else tg.HapticFeedback.impactOccurred('light');
  } catch (e) {}
}

/* ══════════════════════════════════════════════
   2. USER INFO
   ══════════════════════════════════════════════ */
const avatarEl = document.getElementById('avatar');
const usernameEl = document.getElementById('username');

if (tgUser.photo_url) {
  avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="">`;
} else {
  avatarEl.textContent = (tgUser.first_name || 'G')[0].toUpperCase();
}

const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
usernameEl.textContent = fullName || tgUser.username || 'Guest';

/* ══════════════════════════════════════════════
   3. RENDERER
   ══════════════════════════════════════════════ */
const container = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ══════════════════════════════════════════════
   4. SCENE + CAMERA
   ══════════════════════════════════════════════ */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 2.2, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 12;
controls.target.set(0, 0.2, 0);

/* ══════════════════════════════════════════════
   5. ENVIRONMENT
   ══════════════════════════════════════════════ */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1024, 512);
  grad.addColorStop(0,   '#050520');
  grad.addColorStop(0.4, '#0066ff');
  grad.addColorStop(0.7, '#ff3399');
  grad.addColorStop(1,   '#000000');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  const spots = [[180,120,'#00ffff'],[600,180,'#ff00aa'],[850,380,'#ffaa00']];
  for (const [x,y,col] of spots) {
    const rg = g.createRadialGradient(x,y,0,x,y,180);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'transparent');
    g.fillStyle = rg;
    g.fillRect(x-180,y-180,360,360);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.environment = makeEnvTexture();

/* ══════════════════════════════════════════════
   6. LIGHTS
   ══════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x404060, 0.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff3388, 40, 20);
rimLight.position.set(-4, 3, -4);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x00aaff, 40, 20);
fillLight.position.set(4, 2, 4);
scene.add(fillLight);

/* ══════════════════════════════════════════════
   7. HERO TORUS KNOT
   ══════════════════════════════════════════════ */
const heroGeo = new THREE.TorusKnotGeometry(1.3, 0.42, 300, 48, 2, 3);
const heroMat = new THREE.MeshPhysicalMaterial({
  color: 0x1188ee, metalness: 1.0, roughness: 0.10,
  clearcoat: 1.0, clearcoatRoughness: 0.05,
  emissive: 0x004488, emissiveIntensity: 0.35,
  envMapIntensity: 1.8
});
const hero = new THREE.Mesh(heroGeo, heroMat);
hero.castShadow = true;
scene.add(hero);

/* ══════════════════════════════════════════════
   8. NEON SPHERES
   ══════════════════════════════════════════════ */
const spheres = [];
const spherePivots = [];
const sphereCount = 8;
const sphereRadius = 3.0;

for (let i = 0; i < sphereCount; i++) {
  const hue = i / sphereCount;
  const col = new THREE.Color().setHSL(hue, 0.9, 0.55);
  const mat = new THREE.MeshPhysicalMaterial({
    color: col, metalness: 0.7, roughness: 0.2,
    emissive: col, emissiveIntensity: 0.9, envMapIntensity: 1.4
  });
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), mat);
  s.castShadow = true;

  const pivot = new THREE.Object3D();
  const angle = (i / sphereCount) * Math.PI * 2;
  const y = (Math.random() - 0.5) * 2.5;
  s.position.set(Math.cos(angle) * sphereRadius, y, Math.sin(angle) * sphereRadius);

  pivot.add(s);
  scene.add(pivot);
  spheres.push(s);
  spherePivots.push(pivot);
}

/* ══════════════════════════════════════════════
   9. SPARK PARTICLES
   ══════════════════════════════════════════════ */
const PARTICLE_COUNT = 800;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colors    = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.6 + Math.random() * 0.4;
  positions[i*3]   = Math.cos(a) * r;
  positions[i*3+1] = (Math.random() - 0.5) * 1.0;
  positions[i*3+2] = Math.sin(a) * r;

  velocities[i*3]   = (Math.random() - 0.5) * 0.8;
  velocities[i*3+1] = Math.random() * 1.2 + 0.3;
  velocities[i*3+2] = (Math.random() - 0.5) * 0.8;

  const c = new THREE.Color().setHSL(0.06 + Math.random()*0.08, 1, 0.6);
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
  size: 0.06, vertexColors: true, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(particles);

/* ══════════════════════════════════════════════
   10. REFLECTIVE FLOOR
   ══════════════════════════════════════════════ */
const mirror = new Reflector(new THREE.PlaneGeometry(30, 30), {
  clipBias: 0.003,
  textureWidth: window.innerWidth * Math.min(devicePixelRatio, 2),
  textureHeight: window.innerHeight * Math.min(devicePixelRatio, 2),
  color: 0x111122
});
mirror.rotation.x = -Math.PI / 2;
mirror.position.y = -2.0;
scene.add(mirror);

/* ══════════════════════════════════════════════
   11. POST-PROCESSING
   ══════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.1, 0.5, 0.55
);
composer.addPass(bloom);

/* ══════════════════════════════════════════════
   12. STATE + ACTIONS
   ══════════════════════════════════════════════ */
const clock = new THREE.Clock();
const state = {
  explodeT: 0, pulseT: 0, gravityT: 0, shakeT: 0,
  vortexActive: false,
  sphereOriginals: spheres.map(s => s.position.clone()),
};

function explode()    { state.explodeT = 1.0; haptic('medium'); }
function vortex()     { state.vortexActive = !state.vortexActive; haptic('medium'); }
function shockwave()  {
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.06, 16, 64), ringMat);
  ring.position.copy(hero.position);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);
  let t = 0;
  const grow = () => {
    t += 0.02;
    if (t > 1) { scene.remove(ring); ringMat.dispose(); return; }
    const s = 1 + t * 14;
    ring.scale.set(s, s, s);
    ringMat.opacity = 1 - t;
    requestAnimationFrame(grow);
  };
  grow();
  haptic('medium');
}
function colorShift() {
  const hue = Math.random();
  heroMat.color.setHSL(hue, 0.9, 0.5);
  heroMat.emissive.setHSL(hue, 0.9, 0.3);
  for (const s of spheres) {
    const c = new THREE.Color().setHSL(Math.random(), 0.9, 0.55);
    s.material.color.copy(c);
    s.material.emissive.copy(c);
  }
  haptic('light');
}
function pulse()   { state.pulseT = 1.0; haptic('light'); }
function gravity() { state.gravityT = 1.0; haptic('medium'); }
function shake()   { state.shakeT = 0.6; haptic('medium'); }
function reset() {
  state.explodeT = state.pulseT = state.gravityT = state.shakeT = 0;
  state.vortexActive = false;
  hero.scale.set(1, 1, 1);
  hero.rotation.set(0, 0, 0);
  spheres.forEach((s, i) => s.position.copy(state.sphereOriginals[i]));
  haptic('success');
  showToast('✨ Reset complete');
}

const actions = { explode, vortex, shock: shockwave, color: colorShift,
                  pulse, gravity, shake, reset };

/* ══════════════════════════════════════════════
   13. UI BINDINGS
   ══════════════════════════════════════════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1400);
}

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    if (actions[a]) actions[a]();
  });
});

// Main button cycles through actions
const mainBtn = document.getElementById('mainBtn');
const cycle = ['explode', 'shock', 'pulse', 'color', 'vortex', 'gravity', 'shake', 'reset'];
let cycleIdx = 0;
mainBtn.addEventListener('click', () => {
  const a = cycle[cycleIdx % cycle.length];
  cycleIdx++;
  actions[a]();
  showToast(a.toUpperCase() + ' activated');
});

// Telegram MainButton (native button at bottom of Telegram UI — optional)
if (tg?.MainButton) {
  try {
    tg.MainButton.setParams(
