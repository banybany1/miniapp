<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030308">
<title>NEKOVERSE — Anime Energy OS Gold</title>
<style>
/* ================================================================
   NEKOVERSE — Anime Energy OS (Ultra AAA Edition)
   Hyper-realistic iOS Dark Theme • Web Audio Synthesizer • VFX Engine
   ================================================================ */

:root {
  --bg-void: #030308;
  --bg-deep: #080814;
  --bg-card: rgba(20, 20, 42, 0.65);
  --bg-glass: rgba(255, 255, 255, 0.05);
  --bg-glass-strong: rgba(255, 255, 255, 0.12);
  --border-soft: rgba(255, 255, 255, 0.09);
  --border-glow: rgba(168, 85, 247, 0.45);
  --pink: #ff2d95;
  --pink-soft: #ff6bb5;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --gold: #fbbf24;
  --green: #34d399;
  --red: #f87171;
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-ios: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --glow-pink: 0 0 20px rgba(255, 45, 149, 0.6), 0 0 45px rgba(255, 45, 149, 0.3);
  --glow-cyan: 0 0 20px rgba(34, 211, 238, 0.55), 0 0 40px rgba(34, 211, 238, 0.25);
  --glow-purple: 0 0 22px rgba(168, 85, 247, 0.55);
  --glow-gold: 0 0 20px rgba(251, 191, 36, 0.55);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg-void);
  color: var(--text);
  user-select: none;
}

body {
  position: relative;
  overscroll-behavior: none;
}

/* ---------- HIGH GRAPHICS CANVASES ---------- */
#star-canvas, #energy-canvas, #fx-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
#energy-canvas { z-index: 1; }
#fx-canvas { z-index: 998; }

/* ---------- AURORA & ORBS ---------- */
.aurora {
  position: fixed;
  inset: -30%;
  z-index: 0;
  pointer-events: none;
  background: conic-gradient(from 120deg at 50% 50%, transparent, rgba(168,85,247,0.12), transparent, rgba(34,211,238,0.1), transparent, rgba(255,45,149,0.08), transparent);
  filter: blur(80px);
  animation: auroraSpin 35s linear infinite;
  opacity: 0.95;
}
@keyframes auroraSpin { to { transform: rotate(360deg); } }

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.45;
  pointer-events: none;
  z-index: 0;
  animation: orbDrift 20s var(--ease-smooth) infinite;
}
.orb-a {
  width: 420px; height: 420px;
  background: radial-gradient(circle, var(--pink), transparent 70%);
  top: -120px; left: -100px;
}
.orb-b {
  width: 360px; height: 360px;
  background: radial-gradient(circle, var(--cyan), transparent 70%);
  bottom: 2%; right: -90px;
  animation-delay: -6s;
}
.orb-c {
  width: 300px; height: 300px;
  background: radial-gradient(circle, var(--purple), transparent 70%);
  top: 40%; left: 20%;
  animation-delay: -12s;
}
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(50px, -60px) scale(1.15); }
  66% { transform: translate(-40px, 40px) scale(0.9); }
}

/* ---------- APP SHELL ---------- */
.app-shell {
  position: relative;
  z-index: 2;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: calc(72px + var(--safe-bot));
}
@media (min-width: 900px) {
  .app-shell {
    max-width: 480px;
    box-shadow: 0 0 100px rgba(168,85,247,0.2), 0 0 0 1px rgba(255,255,255,0.08);
  }
}

/* ---------- INTRO SPLASH ---------- */
.intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s var(--ease-smooth), visibility 0.8s;
}
.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro-logo {
  font-size: 88px;
  animation: logoPulse 1.8s ease-in-out infinite;
  filter: drop-shadow(0 0 35px rgba(255, 45, 149, 0.85));
}
@keyframes logoPulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.14) rotate(4deg); filter: drop-shadow(0 0 60px rgba(34, 211, 238, 0.95)); }
}
.intro-title {
  margin-top: 18px;
  font-size: 2.1rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  background: linear-gradient(105deg, var(--pink), var(--cyan), var(--purple), var(--pink));
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmerText 3.5s linear infinite;
}
@keyframes shimmerText { to { background-position: 300% center; } }
.intro-sub {
  margin-top: 8px;
  color: var(--text-dim);
  font-size: 0.95rem;
  font-weight: 500;
}
.intro-bar {
  width: 180px;
  height: 5px;
  margin-top: 28px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.intro-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  animation: loadBar 1.6s var(--ease-smooth) forwards;
  box-shadow: var(--glow-pink);
}
@keyframes loadBar { to { width: 100%; } }

/* ---------- TOP BAR ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 8px;
  flex-shrink: 0;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar-ring {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  position: relative;
  box-shadow: var(--glow-pink);
  animation: avatarPulse 3s ease-in-out infinite;
}
.avatar-ring::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--pink), var(--cyan), var(--purple), var(--pink));
  z-index: -1;
  animation: spin 4s linear infinite;
  opacity: 0.85;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #fff 0);
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #fff 0);
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes avatarPulse {
  0%, 100% { box-shadow: var(--glow-pink); }
  50% { box-shadow: 0 0 30px rgba(255,45,149,0.9), 0 0 60px rgba(168,85,247,0.45); }
}
.greet h1 {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #fff, var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.greet p {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 1px;
}
.topbar-actions {
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border-soft);
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.25s var(--ease-spring), background 0.2s, box-shadow 0.2s;
}
.icon-btn:active { transform: scale(0.85); }
.icon-btn.active {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  border-color: transparent;
  box-shadow: var(--glow-pink);
}

/* ---------- HERO CARD ---------- */
.hero-card {
  margin: 6px 16px 12px;
  padding: 18px 16px;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, rgba(30,20,50,0.85), rgba(15,15,35,0.92));
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
}
.hero-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--pink), var(--cyan), transparent);
}
.hero-card::after {
  content: "";
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%);
  top: -60px; right: -40px;
  pointer-events: none;
}
.hero-row {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
}
.hero-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  box-shadow: var(--glow-pink);
  flex-shrink: 0;
  position: relative;
}
.hero-avatar .lvl-badge {
  position: absolute;
  bottom: -4px;
  right: -4px;
  background: linear-gradient(135deg, var(--gold), #f59e0b);
  color: #111;
  font-size: 0.68rem;
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 999px;
  box-shadow: var(--glow-gold);
}
.hero-info { flex: 1; min-width: 0; }
.hero-name {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.hero-title {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 2px;
}
.xp-bar-wrap {
  margin-top: 10px;
  position: relative;
}
.xp-bar-bg {
  height: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.xp-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--cyan), var(--pink));
  box-shadow: 0 0 14px rgba(34,211,238,0.6);
  transition: width 0.6s var(--ease-smooth);
  width: 35%;
}
.xp-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-mute);
  margin-top: 4px;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
  position: relative;
  z-index: 1;
}
.stat-pill {
  background: var(--bg-glass);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 10px 6px;
  text-align: center;
  transition: transform 0.25s var(--ease-spring);
}
.stat-pill:active { transform: scale(0.94); }
.stat-pill .val {
  font-size: 1.18rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--cyan), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-pill .lbl {
  font-size: 0.65rem;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
}

/* ---------- DAILY BANNER & BANNERS ---------- */
.daily-banner {
  margin: 0 16px 12px;
  padding: 14px 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(245,158,11,0.08));
  border: 1px solid rgba(251,191,36,0.35);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s;
  flex-shrink: 0;
}
.daily-banner:active { transform: scale(0.97); }
.daily-banner.claimed { opacity: 0.55; pointer-events: none; }
.daily-icon {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #f59e0b);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: var(--glow-gold);
  flex-shrink: 0;
}
.daily-text { flex: 1; }
.daily-text h3 { font-size: 0.92rem; font-weight: 800; }
.daily-text p { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
.daily-claim {
  padding: 8px 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--gold), #f59e0b);
  color: #111;
  font-weight: 800;
  font-size: 0.78rem;
  cursor: pointer;
  box-shadow: var(--glow-gold);
  transition: transform 0.25s var(--ease-spring);
}
.daily-claim:active { transform: scale(0.92); }

.social-list {
  padding: 0 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.social-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  transition: transform 0.25s var(--ease-spring);
}
.social-card:active { transform: scale(0.98); }
.social-card.done { opacity: 0.55; border-color: rgba(52,211,153,0.35); }
.social-card .sc-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.06);
}
.social-card .sc-body { flex: 1; min-width: 0; }
.social-card .sc-body h4 { font-size: 0.88rem; font-weight: 700; }
.social-card .sc-body p { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
.social-card .sc-btn {
  padding: 8px 14px;
  border-radius: 999px;
  border: none;
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff;
  white-space: nowrap;
  box-shadow: var(--glow-pink);
  transition: transform 0.2s;
}
.social-card .sc-btn:active { transform: scale(0.94); }
.social-card .sc-btn.joined { background: rgba(52,211,153,0.2); color: var(--green); box-shadow: none; }
.social-card .sc-btn.check { background: linear-gradient(135deg, var(--cyan), var(--blue)); box-shadow: var(--glow-cyan); }

.note-24h {
  margin: 0 16px 12px;
  padding: 14px 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(34,211,238,0.12), rgba(59,130,246,0.08));
  border: 1px solid rgba(34,211,238,0.3);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.note-24h-icon {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: var(--glow-cyan);
}
.note-24h-body { flex: 1; min-width: 0; }
.note-24h-body h3 { font-size: 0.9rem; font-weight: 700; }
.note-24h-body p { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

/* ---------- FILTER CHIPS ---------- */
.filter-scroll {
  display: flex;
  gap: 8px;
  padding: 0 16px 10px;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  background: var(--bg-glass);
  color: var(--text-dim);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s var(--ease-spring);
  white-space: nowrap;
}
.chip.active {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff;
  border-color: transparent;
  box-shadow: var(--glow-pink);
  transform: scale(1.04);
}
.chip:active { transform: scale(0.94); }

/* ---------- MISSION LIST ---------- */
.mission-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--purple) transparent;
}
.mission-scroll::-webkit-scrollbar { width: 3px; }
.mission-scroll::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }

.mission-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border-soft);
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s var(--ease-ios), opacity 0.3s, border-color 0.3s;
  cursor: pointer;
}
.mission-card:active { transform: scale(0.98); }
.mission-card.done { opacity: 0.5; }
.mission-card.done .mission-title { text-decoration: line-through; color: var(--text-dim); }

.mission-card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 4px 0 0 4px;
}
.mission-card.diff-easy::before { background: linear-gradient(180deg, var(--green), var(--cyan)); }
.mission-card.diff-medium::before { background: linear-gradient(180deg, var(--gold), #f59e0b); }
.mission-card.diff-hard::before { background: linear-gradient(180deg, var(--pink), var(--red)); box-shadow: 0 0 10px rgba(255,45,149,0.5); }
.mission-card.diff-legend::before { background: linear-gradient(180deg, var(--purple), var(--cyan)); box-shadow: 0 0 12px rgba(168,85,247,0.6); }

.m-check {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
  transition: all 0.3s var(--ease-spring);
  background: transparent;
}
.m-check.checked {
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  border-color: transparent;
  box-shadow: var(--glow-cyan);
  transform: scale(1.08);
}
.m-body { flex: 1; min-width: 0; }
.mission-title { font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
.m-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.m-tag {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(168,85,247,0.22);
  color: #c4b5fd;
  font-weight: 600;
}
.m-diff {
  font-size: 0.62rem;
  padding: 2px 7px;
  border-radius: 999px;
  font-weight: 700;
  text-transform: uppercase;
}
.diff-easy .m-diff { background: rgba(52,211,153,0.2); color: var(--green); }
.diff-medium .m-diff { background: rgba(251,191,36,0.2); color: var(--gold); }
.diff-hard .m-diff { background: rgba(255,45,149,0.2); color: var(--pink-soft); }
.diff-legend .m-diff { background: rgba(168,85,247,0.25); color: #c4b5fd; }
.m-reward { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.m-xp, .m-coin { font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
.m-xp { background: rgba(34,211,238,0.15); color: var(--cyan); }
.m-coin { background: rgba(251,191,36,0.15); color: var(--gold); }

/* ---------- SCREENS & NAVIGATION ---------- */
.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  animation: screenIn 0.4s var(--ease-smooth) both;
}
.screen.active { display: flex; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* NAVBAR */
.nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(68px + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: rgba(10, 10, 24, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-around;
  align-items: center;
