<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>NEKOVERSE — Anime Energy OS</title>

/* ================================================================
   NEKOVERSE — Anime Energy OS
   Premium Dark iOS + Anime • Interactive Touch + Motion Canvas
   ================================================================ */

:root {
  --bg-void: #050510;
  --bg-deep: #0a0a18;
  --bg-card: #141428;
  --bg-glass: rgba(255, 255, 255, 0.06);
  --bg-glass-strong: rgba(255, 255, 255, 0.1);
  --border-soft: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(168, 85, 247, 0.35);
  --pink: #ff2d95;
  --pink-soft: #ff6bb5;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --gold: #fbbf24;
  --green: #34d399;
  --red: #f87171;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-ios: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  --glow-pink: 0 0 18px rgba(255, 45, 149, 0.55), 0 0 40px rgba(255, 45, 149, 0.25);
  --glow-cyan: 0 0 18px rgba(34, 211, 238, 0.5), 0 0 36px rgba(34, 211, 238, 0.22);
  --glow-purple: 0 0 20px rgba(168, 85, 247, 0.5);
  --glow-gold: 0 0 18px rgba(251, 191, 36, 0.5);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg-void);
  color: var(--text);
  user-select: none;
  touch-action: manipulation;
}

body {
  position: relative;
  overscroll-behavior: none;
}

/* ---------- CANVASES & ANIMATIONS ---------- */
#star-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.aurora {
  position: fixed;
  inset: -25%;
  z-index: 0;
  pointer-events: none;
  background: conic-gradient(from 120deg at 50% 50%, transparent, rgba(168,85,247,.08), transparent, rgba(34,211,238,.07), transparent, rgba(255,45,149,.06), transparent);
  filter: blur(80px);
  animation: auroraSpin 35s linear infinite;
  opacity: 0.9;
}
@keyframes auroraSpin { to { transform: rotate(360deg); } }

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.45;
  pointer-events: none;
  z-index: 0;
  animation: orbDrift 18s var(--ease-smooth) infinite;
}
.orb-a {
  width: 320px; height: 320px;
  background: radial-gradient(circle, var(--pink), transparent 70%);
  top: -60px; left: -60px;
}
.orb-b {
  width: 280px; height: 280px;
  background: radial-gradient(circle, var(--cyan), transparent 70%);
  bottom: 8%; right: -50px;
  animation-delay: -6s;
}
.orb-c {
  width: 240px; height: 240px;
  background: radial-gradient(circle, var(--purple), transparent 70%);
  top: 40%; left: 20%;
  animation-delay: -12s;
}
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(35px, -40px) scale(1.08); }
  66% { transform: translate(-25px, 25px) scale(0.95); }
}

/* Touch Interactive FX */
.energy-ring {
  position: fixed;
  width: 20px;
  height: 20px;
  margin-left: -10px;
  margin-top: -10px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  animation: energyBurst 0.5s ease-out forwards;
  box-shadow: 0 0 16px rgba(34,211,238,0.8);
}
@keyframes energyBurst {
  0% { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(4.5); opacity: 0; border-color: var(--pink); }
}

/* ---------- APP SHELL ---------- */
.app-shell {
  position: relative;
  z-index: 2;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: calc(10px + var(--safe-bot));
}

/* ---------- SCREENS ---------- */
.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  animation: screenIn 0.4s var(--ease-smooth) both;
}
.screen.active { display: flex; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- INTRO / SPLASH ---------- */
.intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg-void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.7s var(--ease-smooth), visibility 0
